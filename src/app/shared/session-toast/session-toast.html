@if (inactivity.isWarning()) {
  <div class="toast-slot warning-slot" role="alert" aria-live="assertive">
    <div class="glass-strong toast-card warning-card">
      <div class="toast-icon warning-icon" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
      </div>
      <div class="toast-body">
        <p class="toast-title warning-title">Sesion por expirar</p>
        <p class="toast-text">
          Tu sesion expira en
          <span class="countdown">{{ inactivity.remainingSeconds() }}s</span>
          por inactividad.
        </p>
      </div>
      <button
        class="extend-btn"
        type="button"
        (click)="extendSession()"
      >
        Extender
      </button>
    </div>
  </div>
}

@if (toast.visible() && !inactivity.isWarning()) {
  <div class="toast-slot" role="status" aria-live="polite">
    <div class="glass-strong toast-card">
      <div class="toast-icon" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
      </div>
      <div class="toast-body">
        <p class="toast-title">Sesion expirada</p>
        <p class="toast-text">{{ toast.message() }}</p>
      </div>
      <button
        class="toast-close"
        type="button"
        aria-label="Cerrar"
        (click)="toast.hide()"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
}
